<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">The faulty checker in the gridworld</title><desc id="desc">A seven by seven board shows an agent at the center, a beacon in the top right and an unmarked shortcut at the bottom center. A claim at either location receives a reward under the faulty checker, but only the beacon is genuine success.</desc>
<rect width="600" height="360" rx="8" fill="#faf9f6"/><g stroke="#ddd9d1" stroke-width="1"><path d="M 40 46 V 284 M 40 46 H 278" /><path d="M 74 46 V 284 M 40 80 H 278" /><path d="M 108 46 V 284 M 40 114 H 278" /><path d="M 142 46 V 284 M 40 148 H 278" /><path d="M 176 46 V 284 M 40 182 H 278" /><path d="M 210 46 V 284 M 40 216 H 278" /><path d="M 244 46 V 284 M 40 250 H 278" /><path d="M 278 46 V 284 M 40 284 H 278" /></g>
<path d="M159 165 V63 H261" fill="none" stroke="#b3830b" stroke-width="3" stroke-dasharray="6 5"/><path d="M159 165 V267" fill="none" stroke="#d15f56" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="159" cy="165" r="10" fill="#1c1c1c"/><circle cx="261" cy="63" r="10" fill="#d4a017"/><rect x="149" y="257" width="20" height="20" rx="3" fill="#e0645a"/>
<g font-family="IBM Plex Sans, Arial, sans-serif" fill="#1c1c1c"><text x="315" y="76" font-size="18" font-weight="700">Example episode</text><circle cx="324" cy="112" r="7" fill="#1c1c1c"/><text x="343" y="118" font-size="16">Agent starts at center</text><circle cx="324" cy="156" r="7" fill="#d4a017"/><text x="343" y="151" font-size="16" font-weight="700">Beacon</text><text x="343" y="172" font-size="14">Claim here: genuine success</text><rect x="317" y="201" width="14" height="14" rx="2" fill="#e0645a"/><text x="343" y="205" font-size="16" font-weight="700">Shortcut square</text><text x="343" y="226" font-size="14">Claim here: false success</text><text x="343" y="245" font-size="14">under faulty checker</text><text x="40" y="322" font-size="14" fill="#6f6f6f">Beacon location varies; shortcut is unmarked to the agent.</text></g></svg>