<rect x="223" y="64" width="175" height="70" rx="7" fill="#fff" stroke="#dedbd4"/><text x="239" y="91" font-size="15" font-weight="700">Policy–value net</text><text x="239" y="112" font-size="13">Move priors + value</text>
