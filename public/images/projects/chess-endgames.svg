<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-labelledby="title desc"><title id="title">Exact endgames as a reference</title><desc id="desc">Legal endgame positions are solved by backward analysis to obtain exact outcomes and moves, which are checked against Syzygy and used to assess learned models.</desc><rect width="600" height="350" rx="8" fill="#faf9f6"/><g font-family="IBM Plex Sans, Arial, sans-serif" fill="#1c1c1c"><text x="28" y="38" font-size="18" font-weight="700">Solving and testing small endgames</text>
<rect x="28" y="62" width="544" height="62" rx="7" fill="#fff" stroke="#dedbd4"/><text x="46" y="88" font-size="16" font-weight="700">1. Enumerate legal positions</text><text x="46" y="108" font-size="14">KQK, KRK and KPK · use board symmetries</text>
<path d="M300 124v20 m-5 -6 5 6 5 -6" fill="none" stroke="#aaa49a" stroke-width="2"/>
<rect x="28" y="148" width="544" height="62" rx="7" fill="#fff" stroke="#dedbd4"/><text x="46" y="174" font-size="16" font-weight="700">2. Work backward from terminal positions</text><text x="46" y="194" font-size="14">Determine outcomes, optimal moves and mate distance</text>
<path d="M300 210v20 m-5 -6 5 6 5 -6" fill="none" stroke="#aaa49a" stroke-width="2"/>
<rect x="28" y="234" width="544" height="75" rx="7" fill="#fff" stroke="#dedbd4"/><text x="46" y="260" font-size="16" font-weight="700">3. Use the solution as a reference</text><text x="46" y="280" font-size="14">Check outcomes against Syzygy; compare learned values</text><text x="46" y="299" font-size="14">and move quality against the exact solution</text></g></svg>